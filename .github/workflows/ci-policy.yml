name: Protected PR Policy

# Run the guard from the DEFAULT BRANCH, not from code supplied by the PR.
# Never checkout the PR head or execute a PR-provided script here.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Protected PR Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted default-branch policy only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js without pnpm auto-cache
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Verify the trusted policy tests
        run: node --test scripts/ci-policy-guard.spec.mjs

      - name: Enforce PR file integrity without executing PR code
        run: node scripts/ci-policy-guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
