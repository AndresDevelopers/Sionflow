name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify regression and policy gate tests
        run: node --test scripts/local-regression-gate.spec.mjs scripts/cloud-regression-gate.spec.mjs scripts/ci-policy-guard.spec.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and page smoke tests
        run: pnpm test

      - name: Role unit tests (node:test)
        run: pnpm test:roles

      - name: Dependency security audit (high or critical)
        run: pnpm audit --audit-level=high

      - name: Production build
        run: pnpm build
