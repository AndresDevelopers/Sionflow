name: Prepare Next.js 16.4.2 update

on:
  push:
    branches:
      - chore/next-16.4.2-ci-2026-10-19

permissions:
  contents: write

jobs:
  update-lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout update branch
        uses: actions/checkout@v7
        with:
          ref: chore/next-16.4.2-ci-2026-10-19

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh root lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and page smoke tests
        run: pnpm test

      - name: Role unit tests
        run: pnpm test:roles

      - name: Production build
        run: pnpm build
        env:
          CI: "true"

      - name: Compile Firebase Functions
        working-directory: functions
        run: |
          npm install --package-lock=false --ignore-scripts
          npm run build

      - name: Commit verified lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-next-16-4-2.yml
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh lockfile for Next.js 16.4.2"
          git push
